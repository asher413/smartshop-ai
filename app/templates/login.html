{% extends "layout.html" %}
{% block title %}כניסה לסמארטשופ{% endblock %}
{% block content %}
<div class="mx-auto px-3 py-10" style="max-width: 380px">
    <div class="glass-card p-6">
        <h1 class="text-lg font-bold mb-1 text-center">כניסה לסמארטשופ</h1>
        <p class="text-xs text-gray-500 text-center mb-4">ברוכים השבים</p>
        {% if error %}<div role="alert" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-lg mb-4">{{ error }}</div>{% endif %}
        {% if notice %}<div role="status" class="bg-amber-50 border border-amber-200 text-amber-700 text-sm p-3 rounded-lg mb-4">{{ notice }}</div>{% endif %}
        <a href="/auth/google/login" class="google-btn w-full flex items-center justify-center gap-3 py-3 rounded-xl font-bold transition mb-4" aria-label="התחברות עם חשבון Google">
            <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.35 0-4.34-1.58-5.05-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.71A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.71V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l2.99-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l2.99 2.34C4.66 5.16 6.65 3.58 9 3.58z"/></svg>
            המשך עם Google
        </a>
        <div class="flex items-center gap-2 my-3">
            <div class="flex-1 h-px" style="background:var(--border-medium)"></div>
            <span class="text-[10px] font-bold" style="color:var(--text-muted)">או</span>
            <div class="flex-1 h-px" style="background:var(--border-medium)"></div>
        </div>
        <form method="post" action="/login" class="space-y-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label class="block text-xs text-gray-500 mb-1" for="login-email">אימייל</label>
                <input type="email" id="login-email" name="email" required autocomplete="email" class="w-full rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1" for="login-password">סיסמה</label>
                <input type="password" id="login-password" name="password" required autocomplete="current-password" class="w-full rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="btn-primary w-full py-2.5 rounded-xl font-bold text-sm">התחבר</button>
        </form>
        <p class="text-[10px] text-gray-400 text-center mt-3 flex items-center justify-center gap-1"><i class="fa-solid fa-lock text-green-500"></i> מאובטח</p>
        <p class="text-xs text-gray-500 text-center mt-2">אין חשבון? <a href="/signup" class="text-indigo-600 hover:text-indigo-700 underline font-bold">הרשמה</a></p>
    </div>
</div>
{% endblock %}
