services:
  - type: web
    name: smartshop
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install fastapi==0.115.0 uvicorn[standard]==0.30.6 jinja2==3.1.4 sqlalchemy==2.0.34 psycopg2-binary==2.9.9 python-dotenv==1.0.1 pydantic-settings==2.5.2 beautifulsoup4==4.12.3 requests==2.32.3 apscheduler==3.10.4 python-multipart==0.0.9 tenacity==8.5.0 passlib[bcrypt]==1.7.4 bcrypt==4.0.1 itsdangerous==2.2.0 slowapi==0.1.9 authlib==1.3.2 httpx==0.27.2 Pillow meilisearch==0.31.0
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: ""
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SITE_URL
        value: https://smartshop-8jtv.onrender.com
      - key: ADMIN_EMAIL
        value: admin@smartshop.ai
      - key: ADMIN_SECRET_KEY
        value: SmartShop2026!
      - key: SESSION_SECRET_KEY
        value: render-smartshop-secure-key-2026
      - key: GOOGLE_API_KEY
        sync: false
