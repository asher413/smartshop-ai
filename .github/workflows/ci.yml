name: CI

# Runs on every push to any branch and every pull request — the safety net
# that catches broken tests/imports before they reach production.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} — compile + pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches the app's supported runtimes. The project pins
        # chromadb==0.5.5 which requires numpy<2 (see requirements.txt), so
        # the dependency install below is identical to local dev.
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (all Python sources)
        # Compiles every .py in the repo without executing it — catches
        # syntax errors and import-time typos early, before pytest hits them.
        run: |
          python -m compileall -q app tests scripts alembic

      - name: Run tests (pytest)
        run: |
          # -m "not slow" skips the load tests (tests/test_load.py), which
          # need a live uvicorn server on 127.0.0.1:8000 that CI doesn't
          # start. They're meant to run against a deployed instance, not in
          # the unit-test job.
          python -m pytest -q -m "not slow" --junitxml=test-report.xml -o junit_family=legacy -p no:cacheprovider

      - name: Upload test report (on success and failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: test-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Deploy-readiness checklist (JSON)
        run: |
          python scripts/check_deploy.py --json | tee deploy-report.json
          echo "::group::Deploy Report"
          cat deploy-report.json
          echo "::endgroup::"

      - name: Fail loudly if tests were skipped wholesale
        if: always()
        run: |
          # A "0 passed, 0 failed" run usually means pytest silently
          # collected nothing (bad config) — surface that instead of a
          # green-but-empty CI.
          python - <<'EOF'
          import pathlib, sys
          import xml.etree.ElementTree as ET
          p = pathlib.Path("test-report.xml")
          if not p.exists():
              print("::error::No test-report.xml generated — pytest did not run")
              sys.exit(1)
          root = ET.parse(p).getroot()
          # pytest's junitxml wraps everything in <testsuites> with the
          # real counts on the nested <testsuite> element(s) — sum all of
          # them so the check works regardless of wrapper structure.
          suites = root if root.tag == "testsuite" else root.findall(".//testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"pytest summary: {total} tests, {failures} failures, {errors} errors, {skipped} skipped")
          if total == 0:
              print("::error::pytest collected 0 tests — check test discovery")
              sys.exit(1)
          EOF
