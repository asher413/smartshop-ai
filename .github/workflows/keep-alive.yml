name: keep-alive

# Ping /healthz every 5 minutes so the Render free tier doesn't spin down
# after 15 minutes of inactivity. Runs on GitHub's infrastructure for free
# (public repo). GitHub Actions only supports >= 5 minute cron intervals,
# which is comfortably under Render's 15-minute idle timeout.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake /healthz
        run: |
          curl -sS -m 90 -o /dev/null -w "healthz -> %{http_code}\n" \
            https://smartshop-8jtv.onrender.com/healthz || true
