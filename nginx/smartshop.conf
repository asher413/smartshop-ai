# =============================================================================
# SmartShop AI — Nginx Reverse Proxy for Oracle Cloud
#
# Place at: /etc/nginx/sites-available/smartshop
# Then: ln -s /etc/nginx/sites-available/smartshop /etc/nginx/sites-enabled/
# =============================================================================

# Rate limiting: 30 req/s per IP burst 50 — generous enough for browsing
# but stops basic abuse (scraping, brute-force).
limit_req_zone $binary_remote_addr zone=smartshop_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=smartshop_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=smartshop_conn:10m;

# Image proxy cache (add this at http{} level in nginx.conf):
# proxy_cache_path /var/cache/nginx/smartshop/images
#     levels=1:2 keys_zone=image_cache:50m max_size=2g
#     inactive=7d use_temp_path=off;

# Upstream to the Gunicorn/Uvicorn workers
upstream smartshop_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ========================== HTTP → HTTPS redirect ============================
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain after SSL setup

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================== HTTPS server =================================
server {
    # Uncomment these after Certbot issues the certificate:
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # server_name yourdomain.com;

    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern SSL config (A+ on SSL Labs)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (product images via admin panel)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml image/svg+xml;

    # Connection limits
    limit_conn smartshop_conn 50;
    limit_req zone=smartshop_limit burst=50 nodelay;

    # Main proxy
    location / {
        limit_req zone=smartshop_limit burst=50 nodelay;

        proxy_pass http://smartshop_app;
        proxy_http_version 1.1;

        # Headers for the upstream app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support (chat, live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_buffer_size 4k;
    }

    # Stricter rate limit for login/admin endpoints
    location /admin/login {
        limit_req zone=smartshop_login burst=5 nodelay;
        proxy_pass http://smartshop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check — allow without rate limiting
    location /healthz {
        proxy_pass http://smartshop_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
