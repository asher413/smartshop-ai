[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=gunicorn app.api.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:7860 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -
directory=/srv
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="sqlite:///./data/smartshop.db",REDIS_URL="",ENV="production"

[program:scheduler]
command=python -m app.workers.scheduler
directory=/srv
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="sqlite:///./data/smartshop.db",REDIS_URL="",ENV="production"
